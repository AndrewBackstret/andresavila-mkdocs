<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" font-family="'DM Sans','Inter',system-ui,sans-serif">
  <defs>
    <style>
      .title { font-family:'DM Serif Display',Georgia,serif; fill:#f0f9ff; }
      .sub   { fill:#94a3b8; }
      .mark  { fill:#2E6A98; font-weight:700; letter-spacing:.5px; }
      .layer { fill:#2E6A98; letter-spacing:3px; font-weight:600; font-size:14px; }
      .boxt  { fill:#f0f9ff; font-weight:600; }
      .boxs  { fill:#94a3b8; font-size:12.5px; }
      .edge  { stroke:#2E6A98; stroke-width:1.8; fill:none; opacity:.6; }
      .edgef { stroke:#64748b; stroke-width:1.7; fill:none; opacity:.6; }
      .elab  { fill:#6898BA; font-size:12px; }
      .call  { fill:#cbd5e1; font-size:12.5px; font-style:italic; }
      .band  { stroke:#1A3650; stroke-width:1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E6A98" opacity=".8"/>
    </marker>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c" opacity=".6"/>
    </marker>
  </defs>

  <rect width="1500" height="1020" fill="#0D1A28"/>

  <!-- HEADER -->
  <text class="title" x="70" y="60" font-size="36">8am — Client Data Migration Platform</text>
  <text class="sub" x="71" y="90" font-size="15">Python · Django · PostgreSQL · AWS (S3 · DynamoDB · Parameter Store) · Docker · GitHub Actions</text>
  <text class="mark" x="1430" y="56" font-size="16" text-anchor="end">8am</text>
  <line x1="70" y1="108" x2="1430" y2="108" stroke="#1A3650"/>

  <!-- ===== LAYER 1: CLIENT INPUT ===== -->
  <text class="layer" x="70" y="142">CLIENT INPUT</text>
  <line class="band" x1="228" y1="137" x2="1060" y2="137"/>

  <rect x="70" y="154" width="400" height="80" rx="12" fill="#132335" stroke="#2E6A98" stroke-width="1.5"/>
  <text class="boxt" x="270" y="186" font-size="15" text-anchor="middle">Client Source Systems</text>
  <text class="boxs" x="270" y="210" text-anchor="middle">legacy databases · operational systems · various formats</text>

  <rect x="490" y="154" width="440" height="80" rx="12" fill="#132335" stroke="#2E6A98" stroke-width="1.5"/>
  <text class="boxt" x="710" y="186" font-size="15" text-anchor="middle">Business Requirements</text>
  <text class="boxs" x="710" y="210" text-anchor="middle">source-to-target mappings · validation rules · transformation logic</text>

  <!-- ===== LAYER 2: MIGRATION WORKFLOWS ===== -->
  <text class="layer" x="70" y="288">MIGRATION WORKFLOWS</text>
  <line class="band" x1="328" y1="283" x2="1060" y2="283"/>

  <rect x="70" y="298" width="430" height="112" rx="13" fill="#132335" stroke="#2E6A98" stroke-width="1.6"/>
  <text class="boxt" x="285" y="328" font-size="16" text-anchor="middle">Python / Django</text>
  <text class="boxs" x="285" y="352" text-anchor="middle">client-specific migration workflow engine</text>
  <text class="boxs" x="285" y="372" text-anchor="middle">repeatable extraction · transformation · loading</text>
  <text class="boxs" x="285" y="392" text-anchor="middle">execution documentation per client</text>

  <rect x="520" y="298" width="410" height="112" rx="13" fill="#132335" stroke="#2E6A98" stroke-width="1.6"/>
  <text class="boxt" x="725" y="328" font-size="16" text-anchor="middle">Migration Specifications</text>
  <text class="boxs" x="725" y="352" text-anchor="middle">requirements → technical specs</text>
  <text class="boxs" x="725" y="372" text-anchor="middle">source-to-target field mappings</text>
  <text class="boxs" x="725" y="392" text-anchor="middle">transformation + validation rule definitions</text>

  <path class="edge" d="M270,234 L285,298" marker-end="url(#arr)"/>
  <path class="edge" d="M710,234 L725,298" marker-end="url(#arr)"/>

  <!-- ===== LAYER 3: VALIDATION ===== -->
  <text class="layer" x="70" y="468">VALIDATION &amp; PROFILING</text>
  <line class="band" x1="332" y1="463" x2="1060" y2="463"/>

  <rect x="70" y="478" width="390" height="108" rx="13" fill="#132335" stroke="rgba(251,146,60,.5)" stroke-width="1.6"/>
  <text class="boxt" x="265" y="510" font-size="16" text-anchor="middle">Data Profiling</text>
  <text class="boxs" x="265" y="534" text-anchor="middle">automated routines · schema analysis</text>
  <text class="boxs" x="265" y="554" text-anchor="middle">anomaly &amp; outlier detection</text>
  <text class="boxs" x="265" y="574" text-anchor="middle">completeness &amp; format checks</text>

  <rect x="480" y="478" width="450" height="108" rx="13" fill="#132335" stroke="rgba(251,146,60,.5)" stroke-width="1.6"/>
  <text class="boxt" x="705" y="510" font-size="16" text-anchor="middle">Pre-Transfer Validation</text>
  <text class="boxs" x="705" y="534" text-anchor="middle">defect detection before final transfer</text>
  <text class="boxs" x="705" y="554" text-anchor="middle">custom validation rules per client</text>
  <text class="boxs" x="705" y="574" text-anchor="middle">reduce manual remediation effort</text>

  <path class="edge" d="M285,410 L265,478" marker-end="url(#arr)"/>
  <path class="edge" d="M725,410 L705,478" marker-end="url(#arr)"/>
  <path class="edge" d="M460,532 L480,532" marker-end="url(#arr)"/>

  <!-- Validation callout -->
  <rect x="470" y="592" width="500" height="34" rx="7" fill="rgba(251,146,60,.08)" stroke="rgba(251,146,60,.3)" stroke-width="1"/>
  <text x="720" y="614" text-anchor="middle" fill="#fb923c" font-size="10.5" font-weight="600">defects caught here · not after transfer · accuracy + reduced remediation cost</text>

  <!-- ===== LAYER 4: STAGING + AWS ===== -->
  <text class="layer" x="70" y="648">STAGING &amp; SUPPORTING INFRASTRUCTURE</text>
  <line class="band" x1="520" y1="643" x2="1060" y2="643"/>

  <!-- PostgreSQL Staging -->
  <rect x="70" y="660" width="380" height="104" rx="13" fill="#132335" stroke="rgba(52,211,153,.4)" stroke-width="1.6"/>
  <text class="boxt" x="260" y="690" font-size="16" text-anchor="middle">PostgreSQL Staging</text>
  <text class="boxs" x="260" y="714" text-anchor="middle">intermediate storage · cleansed data</text>
  <text class="boxs" x="260" y="734" text-anchor="middle">transformation buffer · validated records</text>
  <text class="boxs" x="260" y="754" text-anchor="middle">ready for final transfer to target</text>

  <!-- AWS infrastructure (leveraged) wrapper -->
  <rect x="468" y="650" width="520" height="118" rx="13" fill="rgba(251,146,60,.04)" stroke="rgba(251,146,60,.35)" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="728" y="670" text-anchor="middle" fill="#fb923c" font-size="10.5" font-weight="600" letter-spacing="2">AWS INFRASTRUCTURE · LEVERAGED</text>

  <!-- S3 -->
  <rect x="484" y="677" width="144" height="80" rx="10" fill="#132335" stroke="rgba(251,146,60,.3)" stroke-width="1.1"/>
  <text x="556" y="704" text-anchor="middle" fill="#fcd34d" font-weight="600" font-size="13">S3</text>
  <text class="boxs" x="556" y="724" text-anchor="middle">file storage</text>
  <text class="boxs" x="556" y="740" text-anchor="middle">data exchange</text>

  <!-- DynamoDB -->
  <rect x="642" y="677" width="154" height="80" rx="10" fill="#132335" stroke="rgba(251,146,60,.3)" stroke-width="1.1"/>
  <text x="719" y="704" text-anchor="middle" fill="#fcd34d" font-weight="600" font-size="13">DynamoDB</text>
  <text class="boxs" x="719" y="724" text-anchor="middle">operational</text>
  <text class="boxs" x="719" y="740" text-anchor="middle">tracking</text>

  <!-- Parameter Store -->
  <rect x="810" y="677" width="162" height="80" rx="10" fill="#132335" stroke="rgba(251,146,60,.3)" stroke-width="1.1"/>
  <text x="891" y="700" text-anchor="middle" fill="#fcd34d" font-weight="600" font-size="12">Parameter</text>
  <text x="891" y="717" text-anchor="middle" fill="#fcd34d" font-weight="600" font-size="12">Store</text>
  <text class="boxs" x="891" y="737" text-anchor="middle">secure config</text>
  <text class="boxs" x="891" y="754" text-anchor="middle">management</text>

  <path class="edge" d="M265,586 L265,660" marker-end="url(#arr)"/>
  <path class="edgef" d="M450,532 C450,610 260,638 260,660" marker-end="url(#arrf)"/>

  <!-- ===== LAYER 5: CI/CD ===== -->
  <text class="layer" x="70" y="824">CI/CD &amp; CONTAINERIZATION</text>
  <line class="band" x1="380" y1="819" x2="1060" y2="819"/>

  <rect x="70" y="836" width="390" height="92" rx="13" fill="#132335" stroke="rgba(56,189,248,.35)" stroke-width="1.6"/>
  <text class="boxt" x="265" y="866" font-size="16" text-anchor="middle">Docker</text>
  <text class="boxs" x="265" y="890" text-anchor="middle">containerized migration components</text>
  <text class="boxs" x="265" y="910" text-anchor="middle">environment consistency across clients</text>

  <rect x="480" y="836" width="390" height="92" rx="13" fill="#132335" stroke="rgba(56,189,248,.35)" stroke-width="1.6"/>
  <text class="boxt" x="675" y="866" font-size="16" text-anchor="middle">GitHub Actions</text>
  <text class="boxs" x="675" y="890" text-anchor="middle">CI/CD workflows · automated testing</text>
  <text class="boxs" x="675" y="910" text-anchor="middle">release control · deployment reliability</text>

  <path class="edge" d="M260,764 L265,836" marker-end="url(#arr)"/>
  <path class="edgef" d="M675,764 L675,836" marker-end="url(#arrf)" stroke-dasharray="4 3"/>
  <path class="edge" d="M460,882 L480,882" marker-end="url(#arr)"/>

  <!-- ===== IMPACT PANEL ===== -->
  <rect x="1090" y="265" width="390" height="680" rx="16" fill="rgba(52,211,153,.03)" stroke="rgba(52,211,153,.35)" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="1285" y="300" text-anchor="middle" fill="#34d399" font-weight="600" font-size="11.5" letter-spacing="1.5">WHAT WAS BUILT</text>
  <line x1="1110" y1="310" x2="1460" y2="310" stroke="rgba(52,211,153,.2)"/>

  <!-- Item 1 -->
  <rect x="1110" y="324" width="350" height="120" rx="11" fill="#132335" stroke="rgba(52,211,153,.3)" stroke-width="1.2"/>
  <text x="1285" y="354" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">Repeatable Workflows</text>
  <text x="1285" y="378" text-anchor="middle" fill="#94a3b8" font-size="12">client-specific migration pipelines</text>
  <text x="1285" y="398" text-anchor="middle" fill="#94a3b8" font-size="12">extraction → transformation → loading</text>
  <text x="1285" y="418" text-anchor="middle" fill="#94a3b8" font-size="12">reusable framework per engagement</text>
  <text x="1285" y="436" text-anchor="middle" fill="#94a3b8" font-size="12">Python / Django · PostgreSQL</text>

  <!-- Item 2 -->
  <rect x="1110" y="460" width="350" height="120" rx="11" fill="#132335" stroke="rgba(52,211,153,.3)" stroke-width="1.2"/>
  <text x="1285" y="490" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">Automated Validation</text>
  <text x="1285" y="514" text-anchor="middle" fill="#94a3b8" font-size="12">defect detection before final transfer</text>
  <text x="1285" y="534" text-anchor="middle" fill="#94a3b8" font-size="12">profiling · cleansing · validation routines</text>
  <text x="1285" y="554" text-anchor="middle" fill="#94a3b8" font-size="12">improved accuracy · reduced remediation</text>
  <text x="1285" y="572" text-anchor="middle" fill="#94a3b8" font-size="11.5">custom rules per client data model</text>

  <!-- Item 3 -->
  <rect x="1110" y="596" width="350" height="120" rx="11" fill="#132335" stroke="rgba(52,211,153,.3)" stroke-width="1.2"/>
  <text x="1285" y="626" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">Migration Specifications</text>
  <text x="1285" y="650" text-anchor="middle" fill="#94a3b8" font-size="12">requirements → technical docs</text>
  <text x="1285" y="670" text-anchor="middle" fill="#94a3b8" font-size="12">source-to-target field mappings</text>
  <text x="1285" y="690" text-anchor="middle" fill="#94a3b8" font-size="12">validation rules · transformation logic</text>
  <text x="1285" y="708" text-anchor="middle" fill="#94a3b8" font-size="12">execution documentation</text>

  <!-- Item 4 -->
  <rect x="1110" y="732" width="350" height="120" rx="11" fill="#132335" stroke="rgba(56,189,248,.3)" stroke-width="1.2"/>
  <text x="1285" y="762" text-anchor="middle" fill="#6898BA" font-size="15" font-weight="700">Containerized CI/CD</text>
  <text x="1285" y="786" text-anchor="middle" fill="#94a3b8" font-size="12">Docker · environment consistency</text>
  <text x="1285" y="806" text-anchor="middle" fill="#94a3b8" font-size="12">GitHub Actions · automated pipelines</text>
  <text x="1285" y="826" text-anchor="middle" fill="#94a3b8" font-size="12">release control · deployment reliability</text>
  <text x="1285" y="844" text-anchor="middle" fill="#94a3b8" font-size="12">reproducible across client environments</text>

  <!-- LEGEND -->
  <line x1="70" y1="952" x2="1060" y2="952" stroke="#1A3650"/>
  <g font-size="13">
    <rect x="70" y="970" width="20" height="13" rx="3" fill="#132335" stroke="#2E6A98" stroke-width="1.5"/>
    <text class="sub" x="100" y="981">core workflows</text>
    <rect x="270" y="970" width="20" height="13" rx="3" fill="#132335" stroke="rgba(251,146,60,.5)" stroke-width="1.5"/>
    <text class="sub" x="300" y="981">validation layer</text>
    <rect x="460" y="970" width="20" height="13" rx="3" fill="#132335" stroke="rgba(52,211,153,.4)" stroke-width="1.5"/>
    <text class="sub" x="490" y="981">staging / output</text>
    <rect x="650" y="970" width="20" height="13" rx="3" fill="#132335" stroke="rgba(251,146,60,.35)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="sub" x="680" y="981">AWS infrastructure (leveraged)</text>
    <rect x="920" y="970" width="20" height="13" rx="3" fill="#132335" stroke="rgba(56,189,248,.35)" stroke-width="1.5"/>
    <text class="sub" x="950" y="981">CI/CD</text>
  </g>
</svg>
