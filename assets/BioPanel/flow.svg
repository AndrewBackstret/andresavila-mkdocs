<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" font-family="'DM Sans','Inter',system-ui,sans-serif">
  <defs>
    <style>
      .title { font-family:'DM Serif Display',Georgia,serif; fill:#f0f9ff; }
      .sub   { fill:#94a3b8; }
      .mark  { fill:#2E6A98; font-weight:700; letter-spacing:.5px; }
      .phase { fill:#2E6A98; letter-spacing:2.5px; font-weight:600; font-size:14px; }
      .boxt  { fill:#f0f9ff; font-weight:600; }
      .boxs  { fill:#94a3b8; font-size:13px; }
      .step  { fill:#6898BA; font-weight:700; font-size:14px; }
      .edge  { stroke:#2E6A98; stroke-width:2; fill:none; opacity:.6; }
      .call  { fill:#cbd5e1; font-style:italic; }
      .band  { stroke:#1A3650; stroke-width:1; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E6A98" opacity=".8"/>
    </marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1A28"/><stop offset="1" stop-color="#0D1A28"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1010" fill="#0D1A28"/>

  <!-- Header -->
  <text class="title" x="70" y="66" font-size="38">Biopanel — Processing Flow</text>
  <text class="sub" x="71" y="98" font-size="15">From a raw lab-report PDF to biomarkers queryable as time series</text>
  <text class="mark" x="1430" y="60" font-size="17" text-anchor="end">biopanel.io</text>
  <line x1="70" y1="118" x2="1430" y2="118" stroke="#1A3650"/>

  <!-- ============ PHASE 1 ============ -->
  <text class="phase" x="70" y="154">1 · SYNCHRONOUS INGEST — FastAPI</text>
  <line class="band" x1="490" y1="149" x2="1430" y2="149"/>
  <g>
    <rect x="70"  y="172" width="290" height="96" rx="12" fill="#132335" stroke="rgba(56,189,248,.32)" stroke-width="1.6"/>
    <text class="boxt" x="215" y="204" font-size="15" text-anchor="middle">POST /lab-reports/upload</text>
    <text class="boxs" x="215" y="230" text-anchor="middle">the patient drags</text>
    <text class="boxs" x="215" y="250" text-anchor="middle">one or more PDFs</text>
  </g>
  <g>
    <rect x="400" y="172" width="300" height="96" rx="12" fill="#132335" stroke="rgba(56,189,248,.32)" stroke-width="1.6"/>
    <text class="boxt" x="550" y="204" font-size="15" text-anchor="middle">Validation</text>
    <text class="boxs" x="550" y="230" text-anchor="middle">PDF only · ≤ 20 MB</text>
    <text class="boxs" x="550" y="250" text-anchor="middle">SHA-256 dedup (409 if duplicate)</text>
  </g>
  <g>
    <rect x="740" y="172" width="320" height="96" rx="12" fill="#132335" stroke="rgba(56,189,248,.32)" stroke-width="1.6"/>
    <text class="boxt" x="900" y="202" font-size="15" text-anchor="middle">LabReport (PROCESSING)</text>
    <text class="boxs" x="900" y="228" text-anchor="middle">flush to get the id (UUID) →</text>
    <text class="boxs" x="900" y="248" text-anchor="middle">upload PDF to provisional path</text>
  </g>
  <g>
    <rect x="1100" y="172" width="330" height="96" rx="12" fill="#132335" stroke="rgba(56,189,248,.32)" stroke-width="1.6"/>
    <text class="boxt" x="1265" y="204" font-size="15" text-anchor="middle">Enqueue Celery task</text>
    <text class="boxs" x="1265" y="230" text-anchor="middle">returns 202 with</text>
    <text class="boxs" x="1265" y="250" text-anchor="middle">{ lab_report_id, task_id }</text>
  </g>
  <path class="edge" d="M360,220 L400,220" marker-end="url(#a)"/>
  <path class="edge" d="M700,220 L740,220" marker-end="url(#a)"/>
  <path class="edge" d="M1060,220 L1100,220" marker-end="url(#a)"/>
  <path class="edge" d="M1265,268 C1265,300 750,300 750,330" marker-end="url(#a)"/>

  <!-- ============ PHASE 2 ============ -->
  <text class="phase" x="70" y="314">2 · ASYNCHRONOUS PROCESSING — Celery worker · workflow DAG (LabReportProcessingWorkflow)</text>
  <rect x="70" y="332" width="1360" height="272" rx="16" fill="rgba(56,189,248,.05)" stroke="rgba(56,189,248,.3)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <g>
    <rect x="130" y="380" width="380" height="160" rx="13" fill="#132335" stroke="#2E6A98" stroke-width="1.6"/>
    <text class="step" x="320" y="404" text-anchor="middle">NODE 1</text>
    <text class="boxt" x="320" y="428" font-size="17" text-anchor="middle">PDFTextExtractionNode</text>
    <text class="boxs" x="320" y="448" text-anchor="middle">pdfplumber → plain text per page</text>
    <text class="boxs" x="320" y="470" text-anchor="middle">+ scanned-page detection</text>
    <text class="boxs" x="320" y="500" text-anchor="middle" fill="#64748b">(deliberately "dumb": text only)</text>
  </g>
  <g>
    <rect x="560" y="380" width="380" height="160" rx="13" fill="#132335" stroke="#2E6A98" stroke-width="1.6"/>
    <text class="step" x="750" y="404" text-anchor="middle">NODE 2</text>
    <text class="boxt" x="750" y="428" font-size="17" text-anchor="middle">StructuredParsingNode</text>
    <text class="boxs" x="750" y="448" text-anchor="middle">LLM GPT-4o-mini → structured rows</text>
    <text class="boxs" x="750" y="470" text-anchor="middle">(value · unit · ref range) + study date,</text>
    <text class="boxs" x="750" y="492" text-anchor="middle">lab, study type, canonical names</text>
  </g>
  <g>
    <rect x="990" y="380" width="380" height="160" rx="13" fill="#132335" stroke="#2E6A98" stroke-width="1.6"/>
    <text class="step" x="1180" y="404" text-anchor="middle">NODE 3</text>
    <text class="boxt" x="1180" y="428" font-size="17" text-anchor="middle">PreviewBuilderNode</text>
    <text class="boxs" x="1180" y="448" text-anchor="middle">upsert Biomarkers · move PDF to</text>
    <text class="boxs" x="1180" y="470" text-anchor="middle">final path · write Readings (PENDING)</text>
    <text class="boxs" x="1180" y="492" text-anchor="middle">to PostgreSQL</text>
  </g>
  <path class="edge" d="M510,460 L560,460" marker-end="url(#a)"/>
  <path class="edge" d="M940,460 L990,460" marker-end="url(#a)"/>
  <text class="sub" x="535" y="450" font-size="12" text-anchor="middle">text</text>
  <text class="sub" x="965" y="450" font-size="12" text-anchor="middle">rows</text>
  <text class="call" x="750" y="578" font-size="14" text-anchor="middle" fill="#cbd5e1">All the intelligence (dates, lab name, name normalization) lives in the LLM — zero regex or per-lab rules.  ~$0.0005/page · ~30–45 s per study.</text>

  <path class="edge" d="M1180,604 C1180,636 175,636 175,672" marker-end="url(#a)"/>

  <!-- ============ PHASE 3 ============ -->
  <text class="phase" x="70" y="654">3 · CONFIRMATION &amp; QUERY</text>
  <line class="band" x1="360" y1="649" x2="1430" y2="649"/>
  <g>
    <rect x="70"  y="672" width="210" height="92" rx="12" fill="#132335" stroke="rgba(251,146,60,.5)" stroke-width="1.6"/>
    <text class="boxt" x="175" y="706" font-size="15" text-anchor="middle">status → PENDING</text>
    <text class="boxs" x="175" y="730" text-anchor="middle">ready to review</text>
  </g>
  <g>
    <rect x="310" y="672" width="250" height="92" rx="12" fill="#132335" stroke="rgba(56,189,248,.32)" stroke-width="1.6"/>
    <text class="boxt" x="435" y="706" font-size="15" text-anchor="middle">Frontend polling</text>
    <text class="boxs" x="435" y="730" text-anchor="middle">every 2 s until PENDING</text>
  </g>
  <g>
    <rect x="590" y="672" width="250" height="92" rx="12" fill="#132335" stroke="rgba(56,189,248,.32)" stroke-width="1.6"/>
    <text class="boxt" x="715" y="706" font-size="15" text-anchor="middle">GET /preview</text>
    <text class="boxs" x="715" y="730" text-anchor="middle">patient reviews · fixes date if missing</text>
  </g>
  <g>
    <rect x="870" y="672" width="230" height="92" rx="12" fill="#132335" stroke="rgba(52,211,153,.5)" stroke-width="1.6"/>
    <text class="boxt" x="985" y="706" font-size="15" text-anchor="middle">POST /confirm</text>
    <text class="boxs" x="985" y="730" text-anchor="middle">status → CONFIRMED</text>
  </g>
  <g>
    <rect x="1130" y="672" width="300" height="92" rx="12" fill="#132335" stroke="rgba(52,211,153,.5)" stroke-width="1.6"/>
    <text class="boxt" x="1280" y="706" font-size="15" text-anchor="middle">Readings queryable</text>
    <text class="boxs" x="1280" y="730" text-anchor="middle">time series · dashboard · CSV export</text>
  </g>
  <path class="edge" d="M280,718 L310,718" marker-end="url(#a)"/>
  <path class="edge" d="M560,718 L590,718" marker-end="url(#a)"/>
  <path class="edge" d="M840,718 L870,718" marker-end="url(#a)"/>
  <path class="edge" d="M1100,718 L1130,718" marker-end="url(#a)"/>

  <!-- ============ AI LANE ============ -->
  <text class="phase" x="70" y="812" fill="#a78bfa">AI LAYER · on-demand analysis (over already-confirmed Readings)</text>
  <line class="band" x1="730" y1="807" x2="1430" y2="807" stroke="#241b3f"/>
  <rect x="70" y="830" width="1360" height="128" rx="14" fill="rgba(167,139,250,.05)" stroke="rgba(167,139,250,.3)" stroke-width="1.3" stroke-dasharray="6 5"/>
  <g>
    <rect x="100"  y="858" width="300" height="70" rx="11" fill="#132335" stroke="rgba(167,139,250,.4)"/>
    <text class="boxt" x="250" y="888" font-size="14" text-anchor="middle">GET /insights/stream</text>
    <text class="boxs" x="250" y="910" text-anchor="middle">Server-Sent Events</text>

    <rect x="440" y="858" width="320" height="70" rx="11" fill="#132335" stroke="rgba(167,139,250,.4)"/>
    <text class="boxt" x="600" y="888" font-size="14" text-anchor="middle">InsightsDataNode</text>
    <text class="boxs" x="600" y="910" text-anchor="middle">builds the bundle (semaphore + trends)</text>

    <rect x="800" y="858" width="350" height="70" rx="11" fill="#132335" stroke="rgba(167,139,250,.4)"/>
    <text class="boxt" x="975" y="888" font-size="14" text-anchor="middle">InsightsStreamingNode</text>
    <text class="boxs" x="975" y="910" text-anchor="middle">GPT-4o + Claude fallback · token stream</text>

    <rect x="1190" y="858" width="240" height="70" rx="11" fill="#132335" stroke="rgba(167,139,250,.4)"/>
    <text class="boxt" x="1310" y="888" font-size="14" text-anchor="middle">persist Insight</text>
    <text class="boxs" x="1310" y="910" text-anchor="middle">markdown + bundle_json + tokens</text>
  </g>
  <path class="edge" d="M400,893 L440,893" marker-end="url(#a)" stroke="#a78bfa" opacity=".5"/>
  <path class="edge" d="M760,893 L800,893" marker-end="url(#a)" stroke="#a78bfa" opacity=".5"/>
  <path class="edge" d="M1150,893 L1190,893" marker-end="url(#a)" stroke="#a78bfa" opacity=".5"/>
</svg>
