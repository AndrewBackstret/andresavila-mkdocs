  <!-- Source zone -->
  <rect x="86" y="487" width="210" height="92" rx="10" class="zone"/>
  <text class="zonet" x="191" y="508" text-anchor="middle">SOURCE</text>
  <text class="boxs" x="191" y="530" text-anchor="middle">raw landing · as-is</text>
  <text class="boxs" x="191" y="549" text-anchor="middle">no transformation</text>
  <text class="boxs" x="191" y="568" text-anchor="middle">Parquet</text>

  <!-- Raw zone -->
  <rect x="312" y="487" width="210" height="92" rx="10" class="zone"/>
  <text class="zonet" x="417" y="508" text-anchor="middle">RAW</text>
  <text class="boxs" x="417" y="530" text-anchor="middle">schema validation</text>
  <text class="boxs" x="417" y="549" text-anchor="middle">standardized types</text>
  <text class="boxs" x="417" y="568" text-anchor="middle">Parquet</text>

  <!-- Clean zone -->
  <rect x="538" y="487" width="210" height="92" rx="10" class="zone"/>
  <text class="zonet" x="643" y="508" text-anchor="middle">CLEAN</text>
