  <text class="boxs" x="500" y="890" text-anchor="middle">market share · manufacturing ops</text>
  <text class="boxs" x="500" y="909" text-anchor="middle">financial dashboards · 100+ migrated reports</text>

  <!-- DS Team integration -->
  <rect x="710" y="838" width="348" height="96" rx="13" fill="#132335" stroke="rgba(251,146,60,.4)" stroke-width="1.5"/>
