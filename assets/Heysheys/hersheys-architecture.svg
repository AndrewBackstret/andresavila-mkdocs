  <text x="1285" y="320" text-anchor="middle" fill="#34d399" font-weight="600" font-size="11.5" letter-spacing="1.5">MEASURED IMPACT</text>
  <line x1="1110" y1="330" x2="1460" y2="330" stroke="rgba(52,211,153,.2)"/>

