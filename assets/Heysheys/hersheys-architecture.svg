  <text x="1285" y="376" text-anchor="middle" fill="#34d399" font-size="28" font-weight="700">2,000+</text>
  <text x="1285" y="400" text-anchor="middle" fill="#f0f9ff" font-size="13" font-weight="600">hours/year saved</text>
  <text x="1285" y="421" text-anchor="middle" fill="#94a3b8" font-size="12">manual ETL work automated</text>
  <text x="1285" y="440" text-anchor="middle" fill="#94a3b8" font-size="12">across full data lifecycle</text>

  <!-- Impact item 2 -->
