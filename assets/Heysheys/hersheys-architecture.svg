<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" font-family="'DM Sans','Inter',system-ui,sans-serif">
  <defs>
    <style>
      .title { font-family:'DM Serif Display',Georgia,serif; fill:#f0f9ff; }
      .sub   { fill:#94a3b8; }
      .mark  { fill:#2E6A98; font-weight:700; letter-spacing:.5px; }
      .layer { fill:#2E6A98; letter-spacing:3px; font-weight:600; font-size:14px; }
      .boxt  { fill:#f0f9ff; font-weight:600; }
      .boxs  { fill:#94a3b8; font-size:12.5px; }
      .edge  { stroke:#2E6A98; stroke-width:1.8; fill:none; opacity:.6; }
      .edgef { stroke:#64748b; stroke-width:1.7; fill:none; opacity:.6; }
      .elab  { fill:#6898BA; font-size:12px; }
      .call  { fill:#cbd5e1; font-size:12.5px; font-style:italic; }
      .band  { stroke:#1A3650; stroke-width:1; }
      .zone  { fill:#0F1F30; stroke:rgba(46,106,152,.35); stroke-width:1.3; }
      .zonet { fill:#6898BA; font-size:11px; font-weight:700; letter-spacing:1.5px; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E6A98" opacity=".8"/>
    </marker>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c" opacity=".7"/>
    </marker>
  </defs>

  <rect width="1500" height="1020" fill="#0D1A28"/>

  <!-- HEADER -->
  <text class="title" x="70" y="60" font-size="36">Hershey's — Data Engineering &amp; Analytics Platform</text>
  <text class="sub" x="71" y="90" font-size="15">Azure Data Factory · Databricks PySpark · ADLS Lakehouse · Power BI · Microsoft Purview</text>
  <text class="mark" x="1430" y="56" font-size="16" text-anchor="end">HSY</text>
  <line x1="70" y1="108" x2="1430" y2="108" stroke="#1A3650"/>

  <!-- ===== LAYER 1: SOURCES ===== -->
  <text class="layer" x="70" y="142">SOURCES</text>
  <line class="band" x1="188" y1="137" x2="1060" y2="137"/>

  <!-- SAP S/4HANA -->
  <rect x="70" y="152" width="178" height="86" rx="11" fill="#132335" stroke="#2E6A98" stroke-width="1.5"/>
  <text class="boxt" x="159" y="184" font-size="14" text-anchor="middle">SAP S/4HANA</text>
  <text class="boxs" x="159" y="206" text-anchor="middle">internal ERP</text>
  <text class="boxs" x="159" y="222" text-anchor="middle">business transactions</text>

  <!-- SQL Server -->
  <rect x="260" y="152" width="178" height="86" rx="11" fill="#132335" stroke="#2E6A98" stroke-width="1.5"/>
  <text class="boxt" x="349" y="184" font-size="14" text-anchor="middle">SQL Server</text>
  <text class="boxs" x="349" y="206" text-anchor="middle">internal databases</text>
  <text class="boxs" x="349" y="222" text-anchor="middle">operational data</text>

  <!-- Excel / Vendor files -->
  <rect x="450" y="152" width="188" height="86" rx="11" fill="#132335" stroke="#2E6A98" stroke-width="1.5"/>
  <text class="boxt" x="544" y="184" font-size="14" text-anchor="middle">Excel · Vendor Files</text>
  <text class="boxs" x="544" y="206" text-anchor="middle">stakeholder exports</text>
  <text class="boxs" x="544" y="222" text-anchor="middle">retailer portals</text>

  <!-- Nielsen -->
  <rect x="650" y="152" width="178" height="86" rx="11" fill="#132335" stroke="#2E6A98" stroke-width="1.5"/>
  <text class="boxt" x="739" y="184" font-size="14" text-anchor="middle">Nielsen</text>
  <text class="boxs" x="739" y="206" text-anchor="middle">external market</text>
  <text class="boxs" x="739" y="222" text-anchor="middle">share data</text>

  <!-- Web: INEGI / Banxico / Bloomberg -->
  <rect x="840" y="152" width="218" height="86" rx="11" fill="#132335" stroke="rgba(56,189,248,.4)" stroke-width="1.5"/>
  <text class="boxt" x="949" y="180" font-size="13" text-anchor="middle">INEGI · Banxico</text>
  <text class="boxt" x="949" y="198" font-size="13" text-anchor="middle">Bloomberg</text>
  <text class="boxs" x="949" y="219" text-anchor="middle">public macro data</text>
  <text class="boxs" x="949" y="235" text-anchor="middle">web portals</text>

  <!-- ===== LAYER 2: INGESTION ===== -->
  <text class="layer" x="70" y="290">INGESTION</text>
  <line class="band" x1="202" y1="285" x2="1060" y2="285"/>

  <!-- ADF box (spans SAP → Nielsen) -->
  <rect x="70" y="300" width="750" height="100" rx="13" fill="#132335" stroke="#2E6A98" stroke-width="1.6"/>
  <text class="boxt" x="445" y="332" font-size="16" text-anchor="middle">Azure Data Factory</text>
  <text class="boxs" x="445" y="356" text-anchor="middle">pipelines + dataflows · SAP S/4HANA · SQL Server · Excel/Vendor · Nielsen</text>
  <text class="boxs" x="445" y="376" text-anchor="middle">monitoring + pipeline health alerts · ADF triggers on schedule</text>

  <!-- Power Automate box (spans web sources) -->
  <rect x="834" y="300" width="224" height="100" rx="13" fill="#132335" stroke="rgba(56,189,248,.4)" stroke-width="1.5"/>
  <text class="boxt" x="946" y="332" font-size="14" text-anchor="middle">Power Automate</text>
  <text class="boxs" x="946" y="356" text-anchor="middle">web extraction</text>
  <text class="boxs" x="946" y="375" text-anchor="middle">scheduled scraping</text>
  <text class="boxs" x="946" y="393" text-anchor="middle">INEGI · Banxico · Bloomberg</text>

  <!-- Arrows: Sources → Ingestion -->
  <path class="edge" d="M159,238 L159,300" marker-end="url(#arr)"/>
  <path class="edge" d="M349,238 L349,300" marker-end="url(#arr)"/>
  <path class="edge" d="M544,238 L544,300" marker-end="url(#arr)"/>
  <path class="edge" d="M739,238 L739,300" marker-end="url(#arr)"/>
  <path class="edge" d="M949,238 L949,300" marker-end="url(#arr)"/>

