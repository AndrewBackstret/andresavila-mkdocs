  <text x="1285" y="506" text-anchor="middle" fill="#34d399" font-size="28" font-weight="700">$750K USD</text>
  <text x="1285" y="530" text-anchor="middle" fill="#f0f9ff" font-size="13" font-weight="600">vendor cost reduction</text>
  <text x="1285" y="551" text-anchor="middle" fill="#94a3b8" font-size="12">Tableau / Springboard → Power BI</text>
  <text x="1285" y="570" text-anchor="middle" fill="#94a3b8" font-size="12">eliminated recurring license spend</text>

  <!-- Impact item 3 -->
  <rect x="1110" y="606" width="350" height="114" rx="11" fill="#132335" stroke="rgba(52,211,153,.3)" stroke-width="1.2"/>
  <text x="1285" y="636" text-anchor="middle" fill="#34d399" font-size="28" font-weight="700">100+</text>
  <text x="1285" y="660" text-anchor="middle" fill="#f0f9ff" font-size="13" font-weight="600">reports migrated</text>
  <text x="1285" y="681" text-anchor="middle" fill="#94a3b8" font-size="12">Tableau/Springboard → Power BI</text>
  <text x="1285" y="700" text-anchor="middle" fill="#94a3b8" font-size="12">new ETL in Azure Data Factory</text>

  <!-- Impact item 4 -->
  <rect x="1110" y="736" width="350" height="114" rx="11" fill="#132335" stroke="rgba(52,211,153,.3)" stroke-width="1.2"/>
  <text x="1285" y="766" text-anchor="middle" fill="#34d399" font-size="28" font-weight="700">35%</text>
  <text x="1285" y="790" text-anchor="middle" fill="#f0f9ff" font-size="13" font-weight="600">pipeline runtime improvement</text>
  <text x="1285" y="811" text-anchor="middle" fill="#94a3b8" font-size="12">reliability + execution efficiency</text>
  <text x="1285" y="830" text-anchor="middle" fill="#94a3b8" font-size="12">regional reporting pipelines</text>

  <!-- HSY Awards callout -->
  <rect x="1110" y="866" width="350" height="68" rx="10" fill="rgba(251,192,45,.07)" stroke="rgba(251,192,45,.35)" stroke-width="1"/>
  <text x="1285" y="892" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">🏆 HSY Awards Mexico Nomination</text>
  <text x="1285" y="912" text-anchor="middle" fill="#94a3b8" font-size="12">outstanding contributions — Mexico reporting</text>
  <text x="1285" y="926" text-anchor="middle" fill="#94a3b8" font-size="11.5">predictive analytics &amp; market share initiative</text>

  <!-- LEGEND -->
  <line x1="70" y1="954" x2="1060" y2="954" stroke="#1A3650"/>
  <g font-size="13">
    <rect x="70" y="972" width="24" height="13" rx="3" fill="#132335" stroke="#2E6A98" stroke-width="1.5"/>
    <text class="sub" x="104" y="983">core pipeline</text>
    <rect x="250" y="972" width="24" height="13" rx="3" fill="#132335" stroke="rgba(52,211,153,.7)" stroke-width="1.5"/>
