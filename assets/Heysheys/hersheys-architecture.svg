  <text class="boxs" x="884" y="890" text-anchor="middle">consumes Clean/Serving tables</text>
  <text class="boxs" x="884" y="909" text-anchor="middle">predictive models → output tables → Power BI</text>

  <!-- Arrows: Databricks → Serving -->
  <path class="edge" d="M300,768 C230,800 180,820 180,838" marker-end="url(#arr)"/>
  <path class="edge" d="M400,768 L500,838" marker-end="url(#arr)"/>
  <path class="edgef" d="M500,768 L884,838" marker-end="url(#arrf)"/>

