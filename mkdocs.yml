site_name: Andres Avila
site_description: Senior Data Engineer specialized in AI-Powered Data Systems, Cloud, and Automation.
site_url: https://andresavila.io
site_author: Andres Avila

nav:
  - Home:
    - About: index.md
  - Case Studies:
    - Overview: portfolio/index.md
    - Projects:
      - portfolio/projects/biopanel.md
      - portfolio/projects/ey-microsoft-financial-platform.md
      - portfolio/projects/hersheys-pipeline-automation.md
      - portfolio/projects/8am-data-migration.md
      - portfolio/projects/wizeline-ai-data-assistant.md
  - Blog:
    - blog/index.md

theme:
  name: material
  features:
    - search.suggest
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - content.tooltips
    - content.tabs.link
    - content.code.copy
    - navigation.footer
  language: en
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Inter
    code: Roboto Mono
  logo: assets/logo.png
  favicon: assets/favicon.png

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/andres-avilaa/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/andresavila
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:andres@andresavila.io
      name: Email

extra_css:
  - stylesheets/extra.css?v=12
  - stylesheets/hero.css?v=12

extra_javascript:
  - javascripts/blog-toc.js?v=1
  - javascripts/lightbox.js?v=1

plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#0D1A28"
        color: "#FFFFFF"
  - blog:
      blog_dir: blog
      authors_file: "{blog}/.authors.yml"
      categories: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.keys

copyright: |
  &copy; 2026 <a href="https://andresavila.io" target="_blank" rel="noopener">Andres Avila</a>. All rights reserved.
